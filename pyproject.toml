[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "circuito-vision"
version = "0.1.0"
description = "MVP para convertir fotos de protoboards en esquemas eléctricos orientativos."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Equipo Circuito Vision" }]
dependencies = [
    "gradio>=5.49.0,<6.0.0",
    "numpy>=2.1.0,<3.0.0",
    "pillow>=11.0.0,<12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[project.scripts]
circuito-vision = "circuito_vision.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/circuito_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
